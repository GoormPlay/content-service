apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: content-service-secret
  namespace: content
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: content-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: content-service-secret
